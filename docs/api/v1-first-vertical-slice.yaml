                  $ref: '#/components/schemas/DuplicateCandidate'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /property-assets/duplicate-candidates/{duplicateCandidateId}/override:
    post:
      operationId: overrideDuplicateCandidate
      summary: Owner override дубль-блокировки (подтверждение «это не дубль»)
      tags: [erp-property-assets]
      parameters:
        - name: duplicateCandidateId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        '200':
          description: Дубль снят (status override_not_duplicate)
          content:
