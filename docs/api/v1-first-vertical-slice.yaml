  /admin/complaints:
    get:
      operationId: adminListComplaints
      summary: >
        ADMIN-OPS-001: admin review queue жалоб — complaint.resolve
        city-scoped (permission-matrix.md разд.2.2 «Модератор вторички
        Батуми»). Deny-by-default: ни одного city-гранта на complaint.resolve
        — пустая очередь, не 403 (тот же принцип, что adminListPublications).
        Без явного status — очередь на проверку (status:pending).
      tags: [admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, resolved_upheld, resolved_dismissed]}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Жалобы в разрешённом city-scope admin'а
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminComplaintListItem'
                  nextCursor: {type: string, nullable: true}
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'

  /admin/complaints/{complaintId}/resolve:
    post:
      operationId: adminResolveComplaint
      summary: >
        Admin critical action: резолюция жалобы (upheld/dismissed), reason
        обязателен (permission-matrix.md разд.4). При decision:upheld
        переиспользует уже существующий D-06 admin unpublish-путь, если
        публикация сейчас status:published (повторное снятие с публикации
        уже снятого listing не является ошибкой этого сценария).
      tags: [admin]
      parameters:
        - name: complaintId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveComplaintRequest'
      responses:
        '200':
          description: Жалоба резолюцирована
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string}
                  status: {type: string, enum: [resolved_upheld, resolved_dismissed]}
        '400':
          description: ADMIN_REASON_REQUIRED — reason короче 10 символов
          $ref: '#/components/responses/Error'
        '403':
          description: ADMIN_SCOPE_INSUFFICIENT — нет complaint.resolve в этом city-scope
          $ref: '#/components/responses/Error'
        '404':
          description: Жалоба не найдена
          $ref: '#/components/responses/Error'
        '409':
          description: Жалоба уже резолюцирована (status не pending)
          $ref: '#/components/responses/Error'

