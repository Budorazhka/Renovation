openapi: 3.0.3
info:
  title: BAZA.sale API — v1 first vertical slice
  version: 0.1.0-proposed
  description: >
    Первый OpenAPI-срез, покрывающий ровно цепочку D-07 (vertical E2E acceptance,
    CLAUDE_HANDOFF_TZ.md разд.9): застройщик создаёт draft ЖК → корпус → этаж →
    юнит → публикует → гость находит через поиск/карту → открывает карточку →
    раскрывает контакт → лид появляется в ERP организации застройщика →
    РОП назначает лид на менеджера → Admin снимает публикацию с причиной →
    marketplace больше не выдаёт карточку, ERP видит причину, audit полон.
    Статус: Proposed, первый цельный проход 25.08.2026. Не production-контракт,
    основа для дальнейшего развития по мере проектирования остальных вертикалей.

servers:
  - url: /api/v1

security:
  - cookieAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: Логин (audience определяется origin запроса, ADR-004)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: Успешный логин, session cookie установлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  identityId: {type: string}
                  requires2fa: {type: boolean}
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /auth/register:
    post:
      operationId: register
      summary: >
        Регистрация Identity (domain-model.md Module 1 command `register`) —
        расширение узкой D-07 spec, тот же паттерн, что unit.price.update/
        status.update в D-01: не в исходной D-07 vertical slice, но без
        этой команды ни одна Identity не может появиться в системе.
        Не создаёт ERP/Admin ProductAccess сама по себе — только базовую
        marketplace-способную Identity (ADR-004).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: {type: string}
                password: {type: string, format: password, minLength: 8}
      responses:
        '201':
          description: Identity создана (без сессии — отдельный /auth/login вызов после)
          content:
            application/json:
              schema:
                type: object
                properties:
                  identityId: {type: string}
        '409':
          description: normalizedLogin уже занят (domain-model.md invariant — уникален глобально)
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход — очищает cookie и инвалидирует серверную сессию.
      security: []
      responses:
        '200':
          description: Сессия успешно завершена
          content:
            application/json:
              schema:
                type: object
                required: [loggedOut]
                properties:
                  loggedOut: { type: boolean }

  /auth/session:
    get:
      operationId: checkSession
      tags: [auth]
      summary: Проверка текущей сессии без побочных эффектов.
      description: >
        Audience определяется сервером по Origin. Отсутствующая, просроченная,
        отозванная или выданная для другого продукта cookie намеренно не
        различаются и возвращают authenticated=false.
      security: []
      responses:
        '200':
          description: Состояние сессии.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: { type: boolean }
        '401':
          description: Origin отсутствует или не относится к известному продукту.
          $ref: '#/components/responses/Error'

  /me:
    get:
      operationId: getErpMe
      summary: Канонический контекст текущего пользователя ERP (Identity, Organization, Position, Permissions)
      description: >
        Audience и TenantContext определяются сервером исключительно по baza_session cookie.
        Возвращает агрегированный профиль identity, organization, position и список эффективных
        прав (grants).
      tags: [erp-context]
      responses:
        '200':
          description: Текущий контекст пользователя ERP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpMeResponse'
        '401':
          description: AUTH_NO_SESSION — нет session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет активного tenant context (сессия не erp или нет активной позиции)
          $ref: '#/components/responses/Error'

  /exports/{entity}:
    get:
      operationId: runExport
      summary: >
        Выгрузка CRM-списка в XLSX (export.run). Сущность — одна из
        leads/deals/contacts/tasks.

        ВАЖНО: сам грант export.run НЕ даёт доступа к данным. Дополнительно
        требуется право на чтение конкретной сущности (lead.read, deal.read,
        contact.read, task.read) и применяется то же сужение по scope, что и
        у соответствующего list-эндпоинта: own-grant выгружает только своё.
        Иначе выгрузка стала бы обходом прав на чтение — сразу файлом и
        целиком. Например, `administrator` имеет export.run, но не имеет
        deal.read, и получает 403 на /exports/deals.

        Выгрузка ограничена 10 000 строками: превышение отклоняется целиком,
        файл не обрезается молча.
      tags: [erp-crm]
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [leads, deals, contacts, tasks]
      responses:
        '200':
          description: XLSX-файл выгрузки (Content-Disposition attachment, имя файла в filename* RFC 5987)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: VALIDATION_FAILED — неизвестная сущность ИЛИ превышен потолок в 10 000 строк
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет export.run ЛИБО нет права на чтение этой сущности
          $ref: '#/components/responses/Error'

  /organizations/register:
    post:
      operationId: registerOrganization
      summary: Регистрация новой организации и создание роли первого владельца (onboarding)
      tags: [organizations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrganizationRequest'
      responses:
        '201':
          description: Организация создана, сессия установлена в cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterOrganizationResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: UNAUTHORIZED — неверный логин или пароль Identity
          $ref: '#/components/responses/Error'
        '409':
          description: CONFLICT — у Identity уже есть организация или имя занято
          $ref: '#/components/responses/Error'

  /team-users/invite/{token}/activate:
    post:
      operationId: activateInvitation
      summary: >
        Активация приглашения одноразовым токеном (публичный, анонимный —
        приглашённый ещё не залогинен, нет cookie/сессии). Rate-limit по IP
        (invite-activate, 10/60с) — приглашение принимает password для новой
        Identity, тот же класс защиты, что /auth/login.
      tags: [organizations]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, format: password, minLength: 8}
      responses:
        '200':
          description: Приглашение активировано
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      activated: {type: boolean}
                      email: {type: string}
        '404':
          description: NOT_FOUND — токен невалиден, истёк или уже использован
          $ref: '#/components/responses/Error'
        '429':
          description: RATE_LIMITED
          $ref: '#/components/responses/Error'

  /organizations/{organizationId}/positions/{positionId}/assign:
    post:
      operationId: assignOccupantByIdentity
      summary: >
        Назначить существующую Identity на Position по identityId
        (position.assign_occupant.organization). :organizationId в URL —
        только читаемость пути, фактическая tenant-принадлежность проверяется
        сервером по TenantContext (URL/body от клиента не является источником
        истины) — расхождение с текущим tenant даёт 404, не 400.
      tags: [organizations]
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: {type: string}
        - name: positionId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityId, occupantDisplayName]
              properties:
                identityId: {type: string}
                occupantDisplayName: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Identity назначена на Position
          content:
            application/json:
              schema:
                type: object
                required: [assignmentId]
                properties:
                  assignmentId: {type: string}
        '403':
          description: FORBIDDEN — нет position.assign_occupant
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — organizationId в URL не совпадает с TenantContext, либо Position не существует/чужая
          $ref: '#/components/responses/Error'

  /organizations/{organizationId}/positions/{positionId}/grants:
    post:
      operationId: grantPositionPermission
      summary: >
        Выдать точечный permission grant позиции (personal_access.grant) —
        owner/director explicit ⚙-toggle. :organizationId в URL — та же
        читаемость-only роль, что assign выше.
      tags: [organizations]
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: {type: string}
        - name: positionId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, action, scope]
              properties:
                resource: {type: string, minLength: 1}
                action: {type: string, minLength: 1}
                scope: {type: string, enum: [own, position, team, organization, project, city, global, assigned, domain]}
                scopeValue: {type: string}
      responses:
        '200':
          description: Grant выдан
          content:
            application/json:
              schema:
                type: object
                required: [granted]
                properties:
                  granted: {type: boolean, enum: [true]}
        '403':
          description: FORBIDDEN — нет personal_access.grant
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — organizationId в URL не совпадает с TenantContext, либо Position не существует/чужая
          $ref: '#/components/responses/Error'

  /team-users:
    get:
      operationId: listTeamUsers
      summary: >
        Список всех позиций организации, включая HR-PII (loginEmail/phone/
        birthDate/telegram/...) — position.read (security review 31.08.2026:
        раньше без PermissionGuard, отдавал PII любой сессии организации).
        Ответ обёрнут в {success, data} — контракт, которого ожидает
        существующий ERP-клиент (teamApi.ts), не общий формат остальных
        controller'ов этой кодовой базы.
      tags: [organizations]
      responses:
        '200':
          description: Все позиции организации
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {type: array, items: {$ref: '#/components/schemas/TeamUserView'}}
        '403':
          description: FORBIDDEN — нет position.read
          $ref: '#/components/responses/Error'
    post:
      operationId: createTeamUser
      summary: >
        Создать позицию и сразу назначить occupant'а с паролем, заданным
        руководителем (position.create.organization) — отдельный от
        email-invite путь /team-users/positions/{positionId}/assign.
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamUserRequest'
      responses:
        '201':
          description: Позиция создана и занята
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/TeamUserView'}
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет position.create
          $ref: '#/components/responses/Error'

  /team-users/{positionId}:
    get:
      operationId: getTeamUserById
      summary: >
        Одна позиция по id (position.read, тот же grant, что список) —
        tenant-scoped: чужая или несуществующая позиция отвечает единым
        404 (non-disclosure), закрытая (status:closed) — тоже 404, та же
        семантика, что список исключает закрытые позиции.
      tags: [organizations]
      parameters:
        - name: positionId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Позиция
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/TeamUserView'}
        '403':
          description: FORBIDDEN — нет position.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — позиция не существует, чужая организация, или закрыта
          $ref: '#/components/responses/Error'

  /team-users/positions:
    post:
      operationId: createTeamAccountSlot
      summary: >
        Создать вакантную позицию БЕЗ occupant'а («Добавить слот
        менеджера») — position.create.organization, тот же grant, что
        POST /team-users (это тоже создание позиции, просто без человека).
        `position` (человекочитаемый title) и `accessProfile` (custom
        permission map) в теле запроса принимаются, но НЕ сохраняются —
        backend не хранит произвольный текст на позиции (только fixedRole),
        а bulk-набор grant'ов из accessProfile сохранить одним вызовом
        некуда: единственный существующий путь выдачи grant'а —
        один grant за вызов. Позиция получает только стартовый набор прав
        своей роли (DEFAULT_ROLE_GRANTS[fixedRole]), тот же, что обычное
        создание позиции.
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamAccountSlotRequest'
      responses:
        '201':
          description: Вакантная позиция создана
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/TeamUserView'}
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет position.create
          $ref: '#/components/responses/Error'

  /team-users/positions/{positionId}:
    patch:
      operationId: updateTeamUserProfile
      summary: >
        Частичное обновление HR-профильных полей позиции (роль/менеджер/
        пароль здесь не меняются) — переиспользует position.vacate grant
        (тот же круг прав, что vacate/move/status).
      tags: [organizations]
      parameters:
        - name: positionId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamUserProfileRequest'
      responses:
        '200':
          description: Позиция после обновления профиля
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/TeamUserView'}
        '403':
          description: FORBIDDEN — нет position.vacate
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeTeamUser
      summary: >
        Закрыть позицию (position.vacate). Возвращает {success:true, data:null}
        для консистентности с остальными endpoint'ами контроллера, не пустой 204.
      tags: [organizations]
      parameters:
        - name: positionId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Позиция закрыта
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {type: object, nullable: true}
        '403':
          description: FORBIDDEN — нет position.vacate
          $ref: '#/components/responses/Error'

  /team-users/positions/{positionId}/avatar:
    patch:
      operationId: setTeamUserAvatar
      summary: >
        Привязать аватар к позиции по уже подтверждённому assetId (полный
        upload завершается заранее через POST /media/upload-intent →
        presigned URL → POST /media/{assetId}/confirm, не multipart здесь).
      tags: [organizations]
      parameters:
        - name: positionId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: {type: string}
      responses:
        '200':
          description: Позиция с обновлённым аватаром
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/TeamUserView'}
        '403':
          description: FORBIDDEN — нет position.vacate
          $ref: '#/components/responses/Error'

  /team-users/positions/{positionId}/move:
    patch:
      operationId: moveTeamUserPosition
      summary: Сменить руководителя позиции (managerId=null — сделать позицию верхнего уровня)
      tags: [organizations]
      parameters:
        - name: positionId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                managerId: {type: string, nullable: true}
      responses:
        '200':
          description: Позиция после смены руководителя
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/TeamUserView'}
        '403':
          description: FORBIDDEN — нет position.vacate
          $ref: '#/components/responses/Error'

  /team-users/positions/{positionId}/status:
    patch:
      operationId: setTeamUserStatus
      summary: Сменить статус occupant'а позиции — переиспользует position.vacate grant
      tags: [organizations]
      parameters:
        - name: positionId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [active, blocked, invited]}
      responses:
        '200':
          description: Позиция после смены статуса
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/TeamUserView'}
        '403':
          description: FORBIDDEN — нет position.vacate
          $ref: '#/components/responses/Error'

  /team-users/ensure-self:
    post:
      operationId: ensureSelfTeamUser
      summary: >
        Возвращает TeamUserView текущей сессии (self, не весь список) —
        не создаёт ничего, только TenantGuard (без PermissionGuard),
        не раскрывает чужие данные.
      tags: [organizations]
      responses:
        '200':
          description: Собственная позиция текущей сессии, либо null
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/TeamUserView', nullable: true}

  /team-users/ensure-team:
    post:
      operationId: ensureTeam
      summary: >
        Idempotent no-op: организация владельца уже создаётся атомарно при
        регистрации (OrganizationsService.createOrganizationWithOwner), этот
        endpoint только возвращает уже существующие organizationId/positions
        текущего TenantContext — не создаёт ничего нового. position.read.
      tags: [organizations]
      responses:
        '200':
          description: Команда организации текущего TenantContext
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    nullable: true
                    properties:
                      teamId: {type: string}
                      positions: {type: array, items: {$ref: '#/components/schemas/TeamUserView'}}
        '403':
          description: FORBIDDEN — нет position.read
          $ref: '#/components/responses/Error'

  /team-users/positions/{positionId}/assign:
    post:
      operationId: assignTeamUserOccupant
      summary: >
        Email-based invite-flow (position.assign_occupant.organization, тот же
        grant, что OrganizationsController.assignOccupant identityId-путь) —
        фронтенд не знает identityId заранее, резолвит по email: существующая
        Identity линкуется сразу, для новой создаётся pending_invite +
        Invitation с токеном для /team-users/invite/{token}/activate.
      tags: [organizations]
      parameters:
        - name: positionId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, loginEmail]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                email: {type: string, format: email}
                loginEmail: {type: string, format: email}
                phone: {type: string, maxLength: 40}
                telegram: {type: string, maxLength: 100}
      responses:
        '200':
          description: Occupant назначен или создано приглашение
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      user: {$ref: '#/components/schemas/TeamUserView', nullable: true}
                      linkedExisting: {type: boolean}
                      inviteToken: {type: string, nullable: true}
                      inviteTokenExpiresAt: {type: string, format: date-time, nullable: true}
        '403':
          description: FORBIDDEN — нет position.assign_occupant
          $ref: '#/components/responses/Error'

