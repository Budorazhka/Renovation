  /public/messenger/telegram/{accountId}:
    post:
      operationId: receiveTelegramWebhookUpdate
      summary: >-
        N-12: приём входящих апдейтов Telegram Bot API. Вызывающий — серверы
        Telegram, не аутентифицированный клиент платформы: подлинность
        подтверждает секрет вебхука в заголовке
        X-Telegram-Bot-Api-Secret-Token (сверяется внутри сервиса, не
        guard'ом), не проверка прав. Неверный секрет или неизвестный
        accountId обрабатываются молча (без побочных эффектов), всегда
        отвечает 200 — Telegram трактует не-2xx как "не доставлено" и
        повторяет апдейт. Естественная идемпотентность — дедуп по
        {dialogId, externalMessageId}.
      tags: [messenger]
      security: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema: {type: string}
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Telegram Update — узкий срез читается сервисом (только
                message.text), полная схема Telegram Bot API много шире.
      responses:
        '200':
          description: Апдейт принят (либо реально обработан, либо молча отброшен)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean, enum: [true]}

