      responses:
        '201':
          description: Unit создан в статусе available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'

  /developments/{developmentId}/publish:
    post:
      operationId: publishDevelopment
      summary: Публикация ЖК (draft → active, синхронная транзакция + асинхронная projection, ADR-005)
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/DevelopmentId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: >
            Publication принята, статус publication_pending (ADR-005 патч — worker
            строит полную проекцию асинхронно, этот ответ не ждёт его завершения)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '400':
          description: PUBLICATION_SOURCE_NOT_READY
          $ref: '#/components/responses/Error'
        '409':
          description: IDEMPOTENCY_KEY_CONFLICT
          $ref: '#/components/responses/Error'

  /bookings:
    get:
      operationId: listBookings
      summary: >
        Список бронирований (BOOK-002) — cursor pagination, тот же паттерн,
        что GET /developments. developmentId/buildingId/unitId — независимые
        опциональные фильтры, если переданы несколько сразу, unitId
        побеждает buildingId побеждает developmentId (самый специфичный
        выигрывает). booking.read: organization scope у
        owner/director/rop/developer, own scope у manager (сужение до
        Booking.manager === своя Position).
      tags: [erp-bookings]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: developmentId
          in: query
          schema: {type: string}
        - name: buildingId
          in: query
          schema: {type: string}
        - name: unitId
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [pending, booked, rejected, expired, paid]}
      responses:
        '200':
          description: Список бронирований
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: developmentId/buildingId/unitId не существует/чужая организация
          $ref: '#/components/responses/Error'
    post:
      operationId: createBooking
      summary: Создать атомарную бронь юнита (BOOK-001, ADR-006)
      description: >
        Бронь создаётся только внутри MongoDB-транзакции. BookingLock
        сериализует операции на одном unitId, поэтому две пересекающиеся
        активные брони не могут быть зафиксированы одновременно. Повтор с
        тем же Idempotency-Key возвращает сохранённый ответ.
      tags: [erp-bookings]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Бронь создана в статусе pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Некорректный диапазон дат или отсутствует Idempotency-Key
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Unit или lead не найдены в текущей организации
          $ref: '#/components/responses/Error'
        '409':
          description: Пересечение активной брони или конфликт Idempotency-Key
          $ref: '#/components/responses/Error'

  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      summary: >
        Отменить бронь (BOOK-001 follow-up) — booking.cancel.organization,
        не booking.create.own: отменить может руководитель, не только автор
        брони. Разрешено только из pending/booked; paid (уже оплачена) и
        уже терминальные (rejected/expired) отклоняются как
        BOOKING_INVALID_STATE_TRANSITION — оплаченная бронь требует
        отдельного финансового процесса, вне этого среза.
      tags: [erp-bookings]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, nullable: true}
      responses:
        '200':
          description: Бронь переведена в статус rejected, unit свободен для новых броней
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Отсутствует Idempotency-Key
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Booking не существует/чужая организация (non-disclosure)
          $ref: '#/components/responses/Error'
        '409':
          description: Booking не в pending/booked (уже rejected/expired/paid) или конфликт Idempotency-Key
          $ref: '#/components/responses/Error'

  /bookings/{bookingId}/confirm:
    post:
      operationId: confirmBooking
      summary: >
        Подтвердить бронь (BOOK-001 follow-up) — booking.confirm.own, единственное
        действие из триптиха confirm/cancel/extend, доступное manager'у для
        СВОЕЙ брони (cancel/extend требуют organization grant). pending → booked.
      tags: [erp-bookings]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Бронь переведена в статус booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Отсутствует Idempotency-Key
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Booking не существует/чужая организация/не own (non-disclosure)
          $ref: '#/components/responses/Error'
        '409':
          description: Booking не в pending (уже booked/rejected/expired/paid) или конфликт Idempotency-Key
          $ref: '#/components/responses/Error'

  /bookings/{bookingId}/extend:
    post:
      operationId: extendBooking
      summary: >
        Продлить бронь (BOOK-001 follow-up) — booking.extend.organization
        (не .own, как cancel). Только вперёд: newExpiresAt строго позже
        текущего expiresAt. Проверяется на пересечение с другими активными
        бронями того же unit (исключая саму себя).
      tags: [erp-bookings]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newExpiresAt]
              properties:
                newExpiresAt: {type: string, format: date-time}
      responses:
        '200':
          description: Бронь продлена, dateRange.expiresAt обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Отсутствует Idempotency-Key или newExpiresAt не позже текущего expiresAt
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Booking не существует/чужая организация (non-disclosure)
          $ref: '#/components/responses/Error'
        '409':
          description: Пересечение активной брони, Booking не в pending/booked, или конфликт Idempotency-Key
          $ref: '#/components/responses/Error'

  /bookings/{bookingId}/convert-to-deal:
    post:
      operationId: convertBookingToDeal
      summary: >
        Конвертировать бронь в сделку CRM (Primary Sales). Бронь переходит в paid,
        юнит в sold, создаётся DealDocument в одной транзакции.
      tags: [erp-bookings]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                contactId:
                  type: string
                  pattern: '^[0-9a-fA-F]{24}$'
                dealType:
                  type: string
                  enum: [primary, secondary, rental, assignment]
                installmentPlanId:
                  type: string
                  pattern: '^[0-9a-fA-F]{24}$'
                downPayment:
                  $ref: '#/components/schemas/MoneyAmount'
                expectedCommission:
                  $ref: '#/components/schemas/MoneyAmount'
                notes:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Бронь конвертирована в сделку
          content:
            application/json:
              schema:
                type: object
                required: [booking, dealId]
                properties:
                  booking:
                    $ref: '#/components/schemas/Booking'
                  dealId:
                    type: string
        '400':
          description: Отсутствует Idempotency-Key или невалидные параметры
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Booking/Contact не существует или чужая организация (non-disclosure)
          $ref: '#/components/responses/Error'
        '409':
          description: Booking не в активном статусе, unit уже продан, или конфликт Idempotency-Key
          $ref: '#/components/responses/Error'

  /selections:
    post:
      operationId: createSelection
      summary: >
        Создать подборку лотов для клиента (dev selections). `dev_selection.create`
        — own-scope у manager, organization-scope у owner/director/rop/developer.
        Юнит-существование/принадлежность организации и leadId (если передан)
        проверяются server-side.
      tags: [erp-selections]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSelectionRequest'
      responses:
        '201':
          description: Подборка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — один из unitId или leadId не существует/чужой
          $ref: '#/components/responses/Error'
    get:
      operationId: listSelections
      summary: Список подборок (own-scope у manager сужается до созданных им)
      tags: [erp-selections]
      parameters:
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [draft, sent, viewed, archived]}
      responses:
        '200':
          description: Список подборок
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Selection'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /selections/{id}:
    get:
      operationId: getSelection
      summary: Получить подборку по id
      tags: [erp-selections]
      parameters:
        - $ref: '#/components/parameters/SelectionId'
      responses:
        '200':
          description: Подборка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — не существует/чужая организация/own-scope не совпал
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateSelection
      summary: Обновить общие поля подборки (title/clientName/clientPhone/agentNote/leadId/customization)
      tags: [erp-selections]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/SelectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSelectionRequest'
      responses:
        '200':
          description: Подборка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSelection
      summary: Удалить подборку
      tags: [erp-selections]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/SelectionId'
        - name: expectedVersion
          in: query
          required: false
          schema: {type: integer, minimum: 0}
      responses:
        '204':
          description: Подборка удалена
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT
          $ref: '#/components/responses/Error'

  /selections/{id}/status:
    patch:
      operationId: setSelectionStatus
      summary: Изменить статус подборки (draft/sent/viewed/archived); переход в sent проставляет sentAt
      tags: [erp-selections]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/SelectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, status]
              properties:
                expectedVersion: {type: integer, minimum: 0}
                status: {type: string, enum: [draft, sent, viewed, archived]}
      responses:
        '200':
          description: Статус изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT
          $ref: '#/components/responses/Error'

  /selections/{id}/items:
    post:
      operationId: addSelectionItems
      summary: Добавить лоты в подборку (дедупликация против уже существующих items)
      tags: [erp-selections]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/SelectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, unitIds]
              properties:
                expectedVersion: {type: integer, minimum: 0}
                unitIds: {type: array, items: {type: string}, minItems: 1}
      responses:
        '200':
          description: Лоты добавлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — подборка или один из unitId не существует/чужой
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT
          $ref: '#/components/responses/Error'

  /selections/{id}/items/{unitId}:
    patch:
      operationId: updateSelectionItem
      summary: Заметка агента и/или реакция клиента на конкретный лот подборки
      tags: [erp-selections]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/SelectionId'
        - name: unitId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: {type: integer, minimum: 0}
                agentNote: {type: string}
                reaction: {type: string, enum: [liked, disliked, question], nullable: true}
      responses:
        '200':
          description: Лот подборки обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — подборка не найдена/чужая, либо unitId не в этой подборке
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeSelectionItem
      summary: Удалить лот из подборки
      tags: [erp-selections]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/SelectionId'
        - name: unitId
          in: path
          required: true
          schema: {type: string}
        - name: expectedVersion
          in: query
          required: false
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Лот удалён из подборки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT
          $ref: '#/components/responses/Error'

  /public/developments:
    get:
      operationId: searchPublicDevelopments
      summary: Публичный поиск ЖК (гость, каталог/карта, MongoDB geo/compound индексы ADR-007)
      tags: [public-marketplace]
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: bbox
          in: query
          description: "bounding box для поиска по области карты: minLng,minLat,maxLng,maxLat"
          schema: {type: string}
        - name: city
          in: query
          schema: {type: string}
        - name: publisher
          in: query
          description: >-
            Фильтр «объекты этой компании»: id организации-публикатора
            (застройщика или агентства). Отдельных публичных страниц компаний
            нет — клик по названию ведёт в каталог с этим фильтром.
            Невалидный ObjectId даёт 400, а не пустой список: иначе «нет такой
            компании» было бы неотличимо от «у неё ничего не опубликовано».
          schema: {type: string}
        - name: sort
          in: query
          description: "Порядок выдачи. Для ЖК поддерживается только newest."
          schema: {type: string, enum: [newest], default: newest}
      responses:
        '200':
          description: Список публичных карточек (whitelist-поля из MarketplacePublication, ADR-005)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDevelopmentList'
        '400':
          description: VALIDATION_FAILED — невалидный cursor/limit/bbox или неизвестный query-параметр (D-04A)
          $ref: '#/components/responses/Error'

  /public/developments/{slug}:
    get:
      operationId: getPublicDevelopment
      summary: Публичная карточка ЖК по slug (SSR, только status=published)
      tags: [public-marketplace]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Публичная карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDevelopmentCard'
        '404':
          description: PUBLICATION_NOT_FOUND
          $ref: '#/components/responses/Error'

  /public/developments/{slug}/reveal-contact:
    post:
      operationId: revealContact
      summary: >
        Раскрытие контакта — отдельная rate-limited команда, создаёт Lead
        (master plan D-05: контакты отсутствуют в list/search HTML/JSON,
        reveal отдельная команда с audit/abuse signals)
      tags: [public-marketplace]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKeyHeaderOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealContactRequest'
      responses:
        '200':
          description: Контакт раскрыт, Lead создан в организации застройщика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealContactResponse'
        '409':
          description: IDEMPOTENCY_KEY_CONFLICT — тот же Idempotency-Key уже использован с другим телом запроса
          $ref: '#/components/responses/Error'
        '429':
          description: RATE_LIMITED
          $ref: '#/components/responses/Error'

  /leads/{leadId}/assign:
    post:
      operationId: assignLead
      summary: РОП/Директор/Собственник назначает лид на Position менеджера (ручное назначение, не auto)
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneePositionId]
              properties:
                assigneePositionId: {type: string}
      responses:
        '200':
          description: Лид назначен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '403':
          description: FORBIDDEN — нет lead.assign.organization
          $ref: '#/components/responses/Error'

  /leads/{leadId}/unassign:
    post:
      operationId: unassignLead
      summary: >
        Снять назначение лида (обратное действие POST /leads/{leadId}/assign,
        тот же грант lead.assign.organization — отдельного grant нет). Не
        меняет stage. ownerPositionId становится null.
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Назначение снято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '403':
          description: FORBIDDEN — нет lead.assign.organization
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид не существует или вне организации
          $ref: '#/components/responses/Error'

  /leads/{leadId}:
    get:
      operationId: getLead
      summary: >
        Карточка одного лида (lead.read) — тот же own/organization scope
        сужение, что GET /leads (own-scope видит только лиды, где
        ownerPositionId совпадает с его Position). Единый 404 для "не
        существует" и "не ваш own lead" (non-disclosure).
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Лид
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListItem'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид не существует или вне permission scope
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateLead
      summary: >
        `[phase 3]` Сопутствующие поля лида (lead.update — own у manager,
        organization у owner/director/rop/developer, тот же прецедент, что
        lead.changeStage). НИКОГДА не меняет stage — тот путь остаётся под
        PATCH /leads/{leadId}/stage. `[owner decision — 04.09.2026]`
        realtorStage/curatorStage — собственная 6-шаговая номенклатура
        каждый (`realtor_1..realtor_6`/`curator_1..curator_6`), независимо
        от productType лида, не общий справочник стадии продукта.
        Только явно переданные поля изменяются (частичный PATCH).
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeadRequest'
      responses:
        '200':
          description: Лид после обновления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListItem'
        '400':
          description: VALIDATION_FAILED — невалидное значение поля (например realtorStage вне realtor_1..realtor_6, curatorStage вне curator_1..curator_6)
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.update
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид не существует или вне permission scope
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteLead
      summary: >
        `[phase 3]` Soft delete (lead.delete — organization-only,
        owner/director/rop/developer, БЕЗ manager). LeadDocument помечается
        status:'deleted'+deletedAt, документ и вся его история (LeadEvent/
        audit/Task/Deal) остаются в базе — физического удаления нет. После
        удаления лид перестаёт отдаваться в GET /leads и GET /leads/{leadId}
        (единый 404, тот же non-disclosure принцип, что для чужого лида).
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Лид удалён (soft delete)
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: {type: boolean, enum: [true]}
        '403':
          description: FORBIDDEN — нет lead.delete
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид не существует, вне permission scope или уже удалён
          $ref: '#/components/responses/Error'

  /leads/{leadId}/files:
    get:
      operationId: listLeadFiles
      summary: >
        `[phase 3]` Файлы лида (lead.read, тот же own/organization scope,
        что GET /leads/{leadId}). url резолвится ТОЛЬКО из подтверждённого
        'card' variant (тот же принцип, что avatarUrl в GET /team-users) —
        null, пока worker не построил variant, либо для неизображений.
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Список вложений лида (может быть пустым)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadFile'
        '403':
          description: FORBIDDEN — нет lead.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид не существует или вне permission scope
          $ref: '#/components/responses/Error'
    post:
      operationId: attachLeadFile
      summary: >
        `[phase 3]` Прикрепить уже загруженный и подтверждённый (POST
        /media/upload-intent purpose:'lead_attachment' → POST
        /media/{assetId}/confirm) MediaAsset к лиду (lead.update).
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: {type: string}
      responses:
        '201':
          description: Обновлённый список вложений лида
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadFile'
        '400':
          description: VALIDATION_FAILED — asset ещё не verified
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.update
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид или media asset не существует/вне организации
          $ref: '#/components/responses/Error'

  /leads/{leadId}/files/{assetId}:
    delete:
      operationId: detachLeadFile
      summary: '`[phase 3]` Открепить файл от лида (lead.update) — MediaAsset не удаляется, только ссылка на лиде.'
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
        - name: assetId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Обновлённый список вложений лида
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadFile'
        '403':
          description: FORBIDDEN — нет lead.update
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид не существует или вне permission scope
          $ref: '#/components/responses/Error'

  /leads/{leadId}/contact-actions:
    post:
      operationId: recordLeadContactAction
      summary: >
        `[phase 3]` Append-only лог факта обращения к лиду (звонок/чат) —
        lead.update. Записывается через AuditService (action:'lead.contact'),
        отдельной сущности нет.
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactType]
              properties:
                contactType: {type: string, enum: [call, chat]}
      responses:
        '201':
          description: Факт обращения записан
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded: {type: boolean, enum: [true]}
        '403':
          description: FORBIDDEN — нет lead.update
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид не существует или вне permission scope
          $ref: '#/components/responses/Error'

  /leads/{leadId}/stage:
    patch:
      operationId: changeLeadStage
      summary: >
        Смена стадии лида (lead.changeStage — отдельный grant от lead.assign,
        manager может менять стадию ТОЛЬКО своих (own-scope) лидов).
        Optimistic concurrency: expectedVersion должен совпадать с текущим
        Lead.version.

        Допустимые значения stage зависят от того, задан ли у лида
        productType (owner decision "продуктовые воронки лида" 03.09.2026):
        лид БЕЗ productType — stage обязан входить в generic-пятёрку
        (new/contacted/qualified/converted/lost), переход между стадиями
        ограничен явной матрицей, недопустимый переход при АКТУАЛЬНОЙ
        version отклоняется 400. Лид С productType — stage обязан входить в
        список стадий ИМЕННО этого продукта (см. GET /leads/stage-definitions),
        без матрицы порядка переходов — любая стадия своего продукта
        достижима из любой другой. Устаревшая version в обоих случаях — 409
        (клиент должен обновить данные и повторить).
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, stage]
              properties:
                expectedVersion: {type: integer, minimum: 0}
                stage:
                  type: string
                  description: >
                    Одна из generic-стадий (лид без productType) либо одна
                    из стадий productType этого лида (GET
                    /leads/stage-definitions) — полный список велик (до 22
                    значений на продукт), enum здесь намеренно не
                    перечислен целиком.
                comment:
                  type: string
                  description: >
                    `[phase 3]` Опциональный комментарий, привязанный к
                    ЭТОМУ переходу (легаси createStageComment) — сохраняется
                    на LeadEvent, отдаётся в GET /leads/{leadId}/events.
      responses:
        '200':
          description: Лид после смены стадии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '400':
          description: VALIDATION_FAILED — stage не входит в допустимый для этого лида список (generic-пятёрка либо стадии его productType), либо переход между generic-стадиями недопустим при актуальной version
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.changeStage
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид не существует или вне permission scope
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — expectedVersion не совпадает с текущим
          $ref: '#/components/responses/Error'

  /leads:
    post:
      operationId: createLead
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: >
        Ручное создание лида в CRM (lead.create.organization) — security review
        31.08.2026: грант был выдан всем ролям, но до этого прохода не
        существовало ни одного HTTP-пути завести лид вручную (единственный
        источник — публичный reveal-contact). Ровно один способ указать
        контакт: contactId (уже существующий) либо requesterPhone
        (find-or-create по телефону в этой организации, тот же tenant-local
        dedupe, что reveal-contact). ownerPositionId НЕ проставляется
        автоматически на создателя — лид стартует unassigned, как и лиды с
        сайта; назначение — отдельный вызов POST /leads/{leadId}/assign
        (owner decision: "Автоматическая раздача... не является стартовым
        поведением").

        productType (опционально, owner decision "продуктовые воронки лида"
        03.09.2026): sales/network/owner/agent — legacy CRM знает 4 продукта,
        у каждого свой набор стадий воронки (см. GET /leads/stage-definitions).
        Если передан — лид создаётся сразу в первой стадии воронки ЭТОГО
        продукта, а не в generic 'new'. Не передан — поведение как раньше
        (marketplace reveal-contact, CSV/XLSX импорт и старые клиенты не
        знают о продуктах и продолжают работать без изменений).
      tags: [erp-crm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactId: {type: string}
                requesterName: {type: string}
                requesterPhone: {type: string}
                productType: {type: string, enum: [sales, network, owner, agent]}
      responses:
        '201':
          description: >
            Лид создан, ownerPositionId=null. stage — 'new' (productType не
            передан) либо первая стадия воронки productType (order:1 в
            GET /leads/stage-definitions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListItem'
        '400':
          description: VALIDATION_FAILED — ни contactId, ни requesterPhone не переданы
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.create
          $ref: '#/components/responses/Error'
        '404':
          description: contactId указывает на несуществующий/чужой контакт
          $ref: '#/components/responses/Error'
    get:
      operationId: listLeads
      summary: >
        Список лидов текущей организации, newest-first, cursor-paginated.
        organization-scope (owner/director/rop/administrator) видит весь
        tenant; own-scope (manager) видит только лиды, где ownerPositionId
        совпадает с его собственной Position — сужение применяется на
        backend до чтения, не постфильтрацией. ownerPositionId в query —
        дополнительное клиентское сужение поверх уже резолвленного scope,
        никогда не расширяет его (own-scope с чужим ownerPositionId в query
        — 400, не 403 и не расширение видимости).
      tags: [erp-crm]
      parameters:
        - name: stage
          in: query
          schema: {type: string, enum: [new, contacted, qualified, converted, lost]}
        - name: ownerPositionId
          in: query
          schema: {type: string}
        - name: stalled
          in: query
          schema: {type: boolean}
          description: Фильтр по признаку stalled (активный лид без открытых задач)
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Лиды текущего tenant/scope, newest-first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
        '400':
          description: VALIDATION_FAILED — невалидный stage/ownerPositionId/cursor/limit, либо ownerPositionId вне permission scope вызывающего
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION — нет baza_session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.read
          $ref: '#/components/responses/Error'

  /leads/stage-definitions:
    get:
      operationId: getLeadStageDefinitions
      summary: >
        Справочник стадий воронки лида по продукту (owner decision
        "продуктовые воронки лида" 03.09.2026) — legacy CRM
        (api-crm.baza.sale) знает 4 продукта (sales/network/owner/agent),
        каждый со своим набором стадий; следующий этап миграции ERP-экранов
        лидов построит UI по этому справочнику вместо захардкоженного
        apps/erp-web/src/data/leads-mock.ts::LEAD_STAGES. Не требует
        специального права (не данные лидов, статичные метаданные) —
        достаточно валидной tenant-сессии.
      tags: [erp-crm]
      responses:
        '200':
          description: Все 4 продукта со своими стадиями, в порядке воронки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadStageDefinitionsResponse'
        '401':
          description: AUTH_NO_SESSION — нет baza_session cookie
          $ref: '#/components/responses/Error'

  /leads/import:
    post:
      operationId: importLeads
      summary: >
        Импорт лидов из CSV/XLSX построчным отчётом об ошибках (import.run).
        Обычный multipart/form-data upload (поле `file`), не MediaModule —
        файл разбирается и отбрасывается в рамках одного запроса, нигде не
        хранится после обработки.

        ВАЖНО: сам грант import.run НЕ даёт доступа создавать лиды.
        Дополнительно требуется lead.create — тот же принцип, что у
        export.run/<entity>.read (см. /exports/{entity} выше): без него
        403, даже если import.run выдан.

        Колонки файла: `name` (опционально), `phone` (обязательно) —
        первая строка заголовок, порядок колонок не важен, matching по
        имени заголовка case-insensitive. Обработка СИНХРОННАЯ в рамках
        HTTP-запроса (не фоновое задание) — потолок 2000 строк, превышение
        отклоняется целиком, файл не обрезается молча (тот же принцип, что
        у /exports/{entity}, но ниже: создание лида — транзакция, на
        порядок тяжелее чтения проекции).

        Идемпотентность: ключ на строку детерминированно вычисляется на
        сервере из (organizationId, phone) — повторная загрузка ТОГО ЖЕ
        файла не создаёт вторую партию лидов, строки с уже импортированным
        телефоном засчитываются как успешные без создания дубля.

        `row` в `errors[]` — 1-indexed номер строки ДАННЫХ (без заголовка).
      tags: [erp-crm]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Импорт обработан (сам факт наличия ошибок в отдельных строках не делает ответ ошибкой)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [total, created, failed, errors]
                    properties:
                      total: {type: integer}
                      created: {type: integer}
                      failed: {type: integer}
                      errors:
                        type: array
                        items:
                          type: object
                          required: [row, message]
                          properties:
                            row: {type: integer}
                            message: {type: string}
        '400':
          description: VALIDATION_FAILED — файл не передан, формат не распознан, нет обязательной колонки phone, либо превышен потолок в 2000 строк
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет import.run ЛИБО нет lead.create
          $ref: '#/components/responses/Error'

  /leads/{leadId}/events:
    get:
      operationId: listLeadEvents
      summary: >
        Append-only история stage-переходов ОДНОГО лида, newest-first,
        cursor-paginated. Tenant и owner/own-scope проверяются ДО чтения
        lead_events (тот же findByIdForOrganization, что GET /leads/{leadId})
        — чужой (другая организация, либо не «свой» лид при own-scope) и
        несуществующий leadId дают ОДИНАКОВЫЙ 404 (non-disclosure).
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: История переходов лида, newest-first (может быть пустой)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadEventListResponse'
        '400':
          description: VALIDATION_FAILED — невалидный leadId/cursor/limit
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION — нет baza_session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид не существует или вне permission scope (non-disclosure, тот же код для обоих случаев)
          $ref: '#/components/responses/Error'

  /leads/{leadId}/timeline:
    get:
      operationId: getLeadTimeline
      summary: >
        Агрегированный timeline активности лида (переходы стадий, создание/завершение/отмена задач,
        CRM audit events). Сортировка newest-first с детерминированным тай-брейкером и курсорной пагинацией.
        Tenant и owner scope проверяются до чтения — чужой лид возвращает 404 (non-disclosure).
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string, enum: [lead_stage_changed, lead_assigned, task_created, task_updated, task_completed, task_cancelled, audit_event]}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Timeline активности лида
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид не существует или вне permission scope
          $ref: '#/components/responses/Error'

  /contacts:
    get:
      operationId: listContacts
      summary: >
        Список контактов текущей организации, newest-first, cursor-paginated.
        organization-scope (owner/director/rop/administrator) видит весь
        tenant; own-scope (manager) видит только контакты, связанные хотя бы
        с одним ЕГО лидом (Contact сам по себе не хранит ownerPositionId —
        own-scope резолвится транзитивно через Lead ДО чтения contacts, не
        постфильтрацией уже прочитанной страницы). `q` — единый поиск по
        name/phone (partial, регистронезависимый), не два отдельных
        query-параметра.
      tags: [erp-crm]
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Контакты текущего tenant/scope, newest-first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListResponse'
        '400':
          description: VALIDATION_FAILED — невалидный q/cursor/limit
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION — нет baza_session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет contact.read
          $ref: '#/components/responses/Error'

  /contacts/{contactId}:
    get:
      operationId: getContact
      summary: >
        Контакт по id. Tenant И own-scope (транзитивно через Lead)
        проверяются ДО чтения — чужой (другая организация, либо не связан
        ни с одним "своим" лидом при own-scope) и несуществующий contactId
        дают ОДИНАКОВЫЙ 404 (non-disclosure). Ответ не содержит session/
        password/internal-полей — явная whitelist-проекция на backend.
      tags: [erp-crm]
      parameters:
        - name: contactId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Контакт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactView'
        '400':
          description: VALIDATION_FAILED — невалидный contactId
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION — нет baza_session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет contact.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — контакт не существует или вне permission scope (non-disclosure, тот же код для обоих случаев)
          $ref: '#/components/responses/Error'

  /contacts/{contactId}/timeline:
    get:
      operationId: getContactTimeline
      summary: >
        Агрегированный timeline активности контакта и связанных с ним лидов и задач текущего tenant'а.
        Для own-scope проверяется транзитивная принадлежность контакта менеджеру через лиды.
      tags: [erp-crm]
      parameters:
        - name: contactId
          in: path
          required: true
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string, enum: [lead_stage_changed, lead_assigned, task_created, task_updated, task_completed, task_cancelled, audit_event]}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Timeline активности контакта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет contact.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — контакт не существует или вне permission scope
          $ref: '#/components/responses/Error'

  /tasks:
    get:
      operationId: listTasks
      summary: >
        Список задач текущей организации, newest-first, cursor-paginated.
        organization-scope (owner/director/rop/administrator/developer)
        видит все задачи tenant'а; own-scope (manager) видит только задачи,
        назначенные на его собственную Position — сужение применяется на
        backend до чтения.
      tags: [erp-crm]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [open, completed, cancelled]}
        - name: assignedPositionId
          in: query
          schema: {type: string}
        - name: leadId
          in: query
          schema: {type: string}
        - name: contactId
          in: query
          schema: {type: string}
        - name: dueBefore
          in: query
          schema: {type: string, format: date-time}
        - name: dueAfter
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Задачи текущего tenant/scope, newest-first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          description: VALIDATION_FAILED — невалидные фильтры или assignedPositionId вне scope
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION — нет baza_session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.read
          $ref: '#/components/responses/Error'

    post:
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: Создание новой CRM-задачи с опциональной привязкой к лиду и контакту
      tags: [erp-crm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.create
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — указанный leadId или contactId не найден
          $ref: '#/components/responses/Error'

  /tasks/{taskId}:
    get:
      operationId: getTask
      summary: >
        Получение задачи по ID. Tenant и own-scope проверяются до чтения —
        чужая задача возвращает 404 (non-disclosure).
      tags: [erp-crm]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Задача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'

    patch:
      operationId: updateTask
      summary: >
        Частичное обновление задачи (заголовок, описание, срок, статус) —
        НИКОГДА исполнителя (assignedPositionId): смена исполнителя только
        через PATCH /tasks/{taskId}/reassign, отдельный grant task.reassign,
        тот же принцип, что lead.assign отделён от lead.changeStage.
        expectedVersion обязателен (conventions.md разд.5 optimistic
        concurrency, тот же паттерн, что PATCH /leads/{leadId}/stage).
      tags: [erp-crm]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: VALIDATION_FAILED / Нельзя редактировать завершённую задачу
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.edit
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — expectedVersion устарел, обновите и повторите
          $ref: '#/components/responses/Error'

  /tasks/{taskId}/attachments/{assetId}/download:
    get:
      operationId: downloadTaskAttachment
      summary: >
        Короткоживущая (5 минут) подписанная ссылка на скачивание вложения
        из приватного бакета. Тот же task.read grant и own/personal-scope,
        что GET /tasks/{taskId} — если задача не видна вызывающему, до
        вложения он не доходит. assetId, не входящий в attachments задачи
        (или задача чужой организации), — 404, тот же non-disclosure
        принцип, что у самой задачи.
      tags: [erp-crm]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string}
        - name: assetId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Ссылка на скачивание
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAttachmentDownloadResponse'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — задача не существует/вне scope, или assetId не входит в её attachments
          $ref: '#/components/responses/Error'

  /tasks/{taskId}/reassign:
    patch:
      operationId: reassignTask
      summary: >
        Смена исполнителя задачи (assignedPositionId) — отдельный grant
        task.reassign (owner-подтверждено 30.08.2026, не task.edit).
        own-scope (manager) может переназначить ТОЛЬКО задачу, уже
        назначенную на себя, и ТОЛЬКО на себя же (либо снять назначение
        через assignedPositionId:null) — не может передать задачу коллеге.
        expectedVersion обязателен (conventions.md разд.5).
      tags: [erp-crm]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignTaskRequest'
      responses:
        '200':
          description: Задача переназначена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: VALIDATION_FAILED — assignedPositionId вне permission scope вызывающего
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.reassign
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — задача или новый assignedPositionId (Position) не найдены/вне tenant
          $ref: '#/components/responses/Error'
        '409':
          description: >
            Position closed (ConflictException — переиспользует OrganizationsService.findAssignablePosition,
            тот же путь, что POST /leads/{leadId}/assign) ИЛИ VERSION_CONFLICT — expectedVersion устарел
          $ref: '#/components/responses/Error'

  /tasks/{taskId}/complete:
    post:
      operationId: completeTask
      summary: >
        Завершение задачи (перевод в статус completed с фиксацией времени и
        исполнителя). Идемпотентно на уровне "уже completed" — повторный
        вызов ЛЮБЫМ expectedVersion после успешного завершения просто
        возвращает текущее состояние (200), не 409/404 — безопасно вызывать
        повторно. Сам переход open→completed версионирован
        (conventions.md разд.5): устаревший expectedVersion на ОТКРЫТОЙ
        задаче — 409, не молчаливый lost update.
      tags: [erp-crm]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
      responses:
        '200':
          description: Задача завершена (или уже была завершена — идемпотентный повтор)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.complete
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — expectedVersion устарел на ЕЩЁ ОТКРЫТОЙ задаче, обновите и повторите
          $ref: '#/components/responses/Error'

  /deals:
    get:
      operationId: listDeals
      summary: >
        Список сделок текущей организации, newest-first, cursor-paginated.
        organization-scope (owner/director/rop/developer) видит все сделки tenant'а;
        own-scope (manager) видит только сделки, где ownerPositionId === собственная Position.
      tags: [erp-crm]
      parameters:
        - name: stage
          in: query
          schema:
            $ref: '#/components/schemas/DealStage'
        - name: ownerPositionId
          in: query
          schema: {type: string}
        - name: leadId
          in: query
          schema: {type: string}
        - name: contactId
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Сделки текущего tenant/scope, newest-first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealListResponse'
        '400':
          description: VALIDATION_FAILED — невалидные фильтры или ownerPositionId вне scope
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION — нет session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.read
          $ref: '#/components/responses/Error'

    post:
      operationId: createDeal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: Создание новой CRM-сделки
      tags: [erp-crm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDealRequest'
      responses:
        '201':
          description: Сделка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.create
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — указанный contactId или leadId не найден в организации
          $ref: '#/components/responses/Error'

  /deals/{dealId}:
    get:
      operationId: getDeal
      summary: >
        Получение детальной информации о сделке.
        Tenant и own-scope проверяются до чтения — чужая сделка возвращает 404 (non-disclosure).
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Сделка найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — сделка не найдена
          $ref: '#/components/responses/Error'

    patch:
      operationId: updateDeal
      summary: >
        Частичное обновление сделки с optimistic concurrency (заголовок,
        описание, комиссия). НЕ меняет ownerPositionId — см.
        PATCH /deals/{dealId}/reassign (client.reassign, отдельный grant
        от deal.edit).
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDealRequest'
      responses:
        '200':
          description: Сделка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.edit
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — сделка была изменена параллельным запросом
          $ref: '#/components/responses/Error'

  /deals/{dealId}/reassign:
    patch:
      operationId: reassignDeal
      summary: >
        Смена ответственного за сделку (ownerPositionId) — отдельный grant
        client.reassign (owner/director/rop, scope organization),
        не deal.edit. Тот же принцип, что PATCH /tasks/{taskId}/reassign
        отделён от task.edit. ownerPositionId у сделки обязательное поле —
        endpoint не поддерживает "снять ответственного", только замену на
        другую assignable позицию той же организации. expectedVersion
        обязателен (conventions.md разд.5).
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignDealRequest'
      responses:
        '200':
          description: Сделка переназначена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет client.reassign
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — сделка или новый ownerPositionId (Position) не найдены/вне tenant
          $ref: '#/components/responses/Error'
        '409':
          description: >
            Position closed (ConflictException — переиспользует OrganizationsService.findAssignablePosition)
            ИЛИ VERSION_CONFLICT — expectedVersion устарел
          $ref: '#/components/responses/Error'

  /deals/{dealId}/stage:
    patch:
      operationId: changeDealStage
      summary: >
        Смена стадии сделки с проверкой матрицы допустимых переходов и optimistic concurrency (expectedVersion).
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDealStageRequest'
      responses:
        '200':
          description: Стадия сделки изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED — недопустимый переход стадии
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.changeStage
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — сделка была изменена параллельным запросом
          $ref: '#/components/responses/Error'

  /deals/{dealId}/participants:
    post:
      operationId: addDealParticipant
      summary: Добавление участника сделки с optimistic concurrency
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDealParticipantRequest'
      responses:
        '200':
          description: Участник добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.edit
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — сделка или контакт участника не найден
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT или DUPLICATE_DETECTED — сделка изменилась параллельно либо контакт уже является участником
          $ref: '#/components/responses/Error'

  /deals/{dealId}/participants/{contactId}:
    delete:
      operationId: removeDealParticipant
      summary: Удаление участника из сделки с optimistic concurrency
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
        - name: contactId
          in: path
          required: true
          schema: {type: string}
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Участник удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.edit
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — участник или сделка не найдены
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — сделка была изменена параллельным запросом
          $ref: '#/components/responses/Error'

  /deals/{dealId}/checklist:
    patch:
      operationId: updateDealChecklist
      summary: Атомарное обновление чек-листа сделки с optimistic concurrency
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDealChecklistRequest'
      responses:
        '200':
          description: Чек-лист обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.edit
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — сделка была изменена параллельным запросом
          $ref: '#/components/responses/Error'

  /calendar/events:
    get:
      operationId: listCalendarEvents
      summary: >
        Список событий календаря за диапазон дат (обязателен — не бесконечный
        список). Событие попадает в выдачу, если пересекается с диапазоном, не
        только если начинается внутри него. organization-scope
        (owner/director/rop/developer) видит все события tenant'а; own-scope
        (manager) — только события, где сам participant ИЛИ createdBy.
      tags: [erp-crm]
      parameters:
        - name: startDate
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: endDate
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/CalendarEventType'
        - name: leadId
          in: query
          schema: {type: string}
        - name: dealId
          in: query
          schema: {type: string}
      responses:
        '200':
          description: События текущего tenant/scope за диапазон, по возрастанию startTime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventListResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет calendar_event.read
          $ref: '#/components/responses/Error'

    post:
      operationId: createCalendarEvent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: >
        Создание события календаря. `isRecurring`/`recurringRule`/
        `parentEventId`/`reminderMinutes` ХРАНЯТСЯ, но НЕ ИНТЕРПРЕТИРУЮТСЯ
        (осознанно урезанный scope этого прохода) — сервер не разворачивает
        серию будущих вхождений и не планирует email/push по напоминаниям.
      tags: [erp-crm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalendarEventRequest'
      responses:
        '201':
          description: Событие создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет calendar_event.create
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — указанный leadId, dealId или participant (Position) не найден
          $ref: '#/components/responses/Error'

  /calendar/unified:
    get:
      operationId: getUnifiedCalendar
      summary: >
        Объединяет события календаря с задачами (Task), у которых есть срок
        (dueAt) в этом диапазоне — легаси-форма `{events, tasks}`.
        scopePositionId (own-scope calendar_event.read) применяется одинаково
        к обеим частям объединения.
      tags: [erp-crm]
      parameters:
        - name: startDate
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: endDate
          in: query
          required: true
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Объединённое представление календаря
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarUnifiedResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет calendar_event.read
          $ref: '#/components/responses/Error'

  /calendar/events/{eventId}:
    get:
      operationId: getCalendarEvent
      summary: >
        Получение события по ID. Tenant и own-scope проверяются до чтения —
        чужое событие возвращает 404 (non-disclosure).
      tags: [erp-crm]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Событие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет calendar_event.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'

    patch:
      operationId: updateCalendarEvent
      summary: >
        Частичное обновление события — НЕ startTime/endTime (перенос только
        через PATCH /calendar/events/{eventId}/move). expectedVersion
        обязателен (conventions.md разд.5 optimistic concurrency).
      tags: [erp-crm]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCalendarEventRequest'
      responses:
        '200':
          description: Событие обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет calendar_event.update
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — expectedVersion устарел, обновите и повторите
          $ref: '#/components/responses/Error'

    delete:
      operationId: deleteCalendarEvent
      summary: >
        Soft delete события (проставляет deletedAt, НЕ переиспользует поле
        status — см. CalendarEventDocument докстринг). Без expectedVersion,
        тот же выбор, что DELETE /leads/{leadId}.
      tags: [erp-crm]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Событие удалено (soft delete)
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: {type: boolean}
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет calendar_event.delete
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'

  /calendar/events/{eventId}/move:
    patch:
      operationId: moveCalendarEvent
      summary: >
        Перенос события (drag&drop в календаре) — легаси отдельно выделяет
        эту команду от общего PATCH. expectedVersion обязателен —
        конкурентное перетаскивание события двумя людьми не должно тихо
        перезаписывать друг друга.
      tags: [erp-crm]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCalendarEventRequest'
      responses:
        '200':
          description: Событие перенесено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет calendar_event.update
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — expectedVersion устарел, обновите и повторите
          $ref: '#/components/responses/Error'

  /crm/reports/lead-funnel:
    get:
      operationId: getLeadFunnelReport
      summary: >
        Воронка лидов ПО ИСТОРИИ переходов (коллекция lead_events), не по
        текущему снимку `Lead.stage` — заменяет легаси
        `GET /crm/analytics/leads-by-stage`, который считал только "сколько
        лидов сейчас на этой стадии". Каждый лид учитывается в стадии не
        больше одного раза за период, даже если проходил её несколько раз
        (owner decision "продуктовые воронки лида", 04.09.2026: конверсия
        считается по уникальным лидам, достигшим стадии, а не по количеству
        событий смены стадии). `productType` сужает на стадии конкретного
        продукта (см. GET /leads/stage-definitions); без него агрегируются
        события любого продукта вперемешку. Требует `crm_report.read`
        (organization scope — owner/director/rop/developer).
      tags: [erp-crm]
      parameters:
        - name: productType
          in: query
          schema: {type: string, enum: [sales, network, owner, agent]}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Разрез по стадиям за период
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadFunnelReportResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет crm_report.read
          $ref: '#/components/responses/Error'

  /crm/reports/positions:
    get:
      operationId: getPositionsReport
      summary: >
        Сводка по позициям (менеджерам) за период `createdAt` — количество
        лидов/сделок на `ownerPositionId` с разбивкой по ТЕКУЩЕЙ стадии (не
        событийная история, в отличие от GET /crm/reports/lead-funnel) и
        сумма `expectedCommission` сделок по валюте. `positionId: null` —
        строка ещё не назначенных лидов/сделок. Бэкенд намеренно НЕ считает
        единую "конверсию" (нет универсального понятия успешной стадии
        независимо от productType/DealStage) — вызывающий код строит её из
        `leadsByStage`/`dealsByStage` сам. Требует `crm_report.read`
        (organization scope — owner/director/rop/developer).
      tags: [erp-crm]
      parameters:
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Разрез по позициям за период
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsReportResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет crm_report.read
          $ref: '#/components/responses/Error'

  /crm/reports/team-performance:
    get:
      operationId: getTeamPerformanceReport
      summary: >
        Комплексный отчёт по эффективности команды и сотрудников: воронка лидов,
        сделки, комиссии, выполнение задач (SLA) и временные ряды активности.
        Требует `crm_report.read` (organization scope — owner/director/rop/developer).
      tags: [erp-crm]
      parameters:
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - name: positionId
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Отчёт по результативности команды
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPerformanceReportResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет crm_report.read
          $ref: '#/components/responses/Error'

  /admin/duplicate-candidates:

    get:
      operationId: adminListDuplicateCandidates
      summary: >
        Admin review queue для DEDUPE-001 (master plan разд.2.3: "Автор может
        заявить, что это не дубль; такое исключение логируется и попадает в
        административную проверку"). duplicate_candidate.read — global scope
        (пара может involve organizations из разных городов, city-scoping
        здесь структурно не подходит, в отличие от publications).
        Отсутствие гранта — ошибка (403), НЕ пустой список (в отличие от
        adminListPublications, где отсутствие read-scope даёт пустой
        результат) — здесь единственный grant либо есть, либо нет, нет
        частичного scope, который стоило бы молча сужать до пустоты.
      tags: [admin]
      parameters:
        - name: status
          in: query
          description: "Без значения — очередь на проверку (detected + override_not_duplicate)"
          schema: {type: string, enum: [detected, override_not_duplicate, confirmed_duplicate]}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список кандидатов с денормализованной парой PropertyAsset для визуального сравнения
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminDuplicateCandidate'
                  nextCursor: {type: string, nullable: true}
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '403':
          description: ADMIN_SCOPE_INSUFFICIENT — нет duplicate_candidate.read
          $ref: '#/components/responses/Error'

  /admin/duplicate-candidates/{duplicateCandidateId}/confirm:
    post:
      operationId: adminConfirmDuplicateCandidate
      summary: >
        Admin critical action: подтверждает, что пара — реальный дубль.
        Единственный actor, кто может confirm ИЗ override_not_duplicate
        (отменяет решение владельца "не дубль"), не только ИЗ detected.
        reason обязателен (permission-matrix.md разд.4).
      tags: [admin]
      parameters:
        - name: duplicateCandidateId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        '200':
          description: Кандидат переведён в confirmed_duplicate
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  status: {type: string, enum: [confirmed_duplicate]}
        '400':
          description: ADMIN_REASON_REQUIRED — reason короче 10 символов
          $ref: '#/components/responses/Error'
        '403':
          description: ADMIN_SCOPE_INSUFFICIENT — нет duplicate_candidate.confirm
          $ref: '#/components/responses/Error'
        '404':
          description: Duplicate candidate не найден
          $ref: '#/components/responses/Error'
        '409':
          description: Уже confirmed_duplicate
          $ref: '#/components/responses/Error'

  /admin/publications:
    get:
      operationId: adminListPublications
      summary: >
        Admin находит publication только в разрешённом scope (мастер-план D-06)
        — deny-by-default: sourceType/city read-grant'ы admin'а определяют,
        что видно, sourceType/city query-параметры дополнительно СУЖАЮТ уже
        разрешённый набор, не расширяют его
      tags: [admin]
      parameters:
        - name: sourceType
          in: query
          schema: {type: string, enum: [development, unit, listing]}
        - name: city
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >
            Список publication в разрешённом scope, ЛЮБОЙ статус (не только
            published — admin должен видеть publication_pending/unpublished/
            build_failed тоже)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        sourceType: {type: string}
                        sourceId: {type: string}
                        organizationId: {type: string, nullable: true}
                        status: {type: string}
                        slug: {type: string, nullable: true}
                        publishedAt: {type: string, nullable: true}
                        unpublishedAt: {type: string, nullable: true}
                        unpublishReason: {type: string, nullable: true}
                        city: {type: string, nullable: true}
                  nextCursor: {type: string, nullable: true}
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'

  /admin/publications/{publicationId}/unpublish:
    post:
      operationId: adminUnpublish
      summary: >
        Admin снимает публикацию с публичного каталога — синхронная транзакция
        (ADR-005 патч), обязательный reason (permission-matrix.md разд.4)
      tags: [admin]
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        '200':
          description: >
            Публикация скрыта немедленно (синхронно), canonical-статус изменён,
            audit event записан в той же транзакции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '400':
          description: ADMIN_REASON_REQUIRED
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN / ADMIN_SCOPE_INSUFFICIENT
          $ref: '#/components/responses/Error'

  /admin/me:
    get:
      operationId: adminMe
      summary: Получение профиля текущего администратора и его скоупа прав
      tags: [admin]
      responses:
        '200':
          description: Данные администратора и его скоуп чтения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '403':
          description: FORBIDDEN — нет активного контекста администратора
          $ref: '#/components/responses/Error'

  /admin/organizations:
    get:
      operationId: adminListOrganizations
      summary: Список организаций (агентства, застройщики) для администратора
      tags: [admin]
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [agency, developer, independent_realtor]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, frozen, archived]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список организаций с пагинацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationListResponse'
        '403':
          description: FORBIDDEN
          $ref: '#/components/responses/Error'

  /admin/organizations/{organizationId}:
    get:
      operationId: adminGetOrganization
      summary: Детальная карточка организации
      tags: [admin]
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Карточка организации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationDetailResponse'
        '403':
          description: FORBIDDEN
          $ref: '#/components/responses/Error'
        '404':
          description: Организация не найдена
          $ref: '#/components/responses/Error'

  /admin/organizations/{organizationId}/freeze:
    post:
      operationId: adminFreezeOrganization
      summary: Заморозка организации администратором с указанием причины
      tags: [admin]
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
