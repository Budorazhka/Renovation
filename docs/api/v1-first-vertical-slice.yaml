    get:
      operationId: getListingPublicationStatus
      summary: >
        ERP polling после publish — читает РЕАЛЬНЫЙ статус MarketplacePublication,
        не canonical Listing.status (тот же паттерн, что D-03
        getPublicationStatus для Development)
      tags: [erp-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Publication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '404':
          description: Listing не существует/чужой ИЛИ публикация никогда не запускалась (единый non-disclosure код)
          $ref: '#/components/responses/Error'

  /marketplace/favorites:
    get:
      operationId: listFavorites
      summary: Избранное покупателя
      description: >-
        Требует сессии: избранное принадлежит человеку, а не организации. Отдаёт только тип и slug —
        карточки страница дочитывает публичными эндпоинтами каталога, поэтому избранное не дублирует
        проекцию публикации и не может разойтись с ней в цене или адресе.
      tags: [marketplace-favorites]
      responses:
        '200':
          description: Список избранного, новые сверху
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: addFavorite
      summary: Добавить объект в избранное
      description: >-
        Идемпотентно по построению: уникальный индекс {identityId, targetType, slug} плюс upsert.
        Повторное нажатие сердечка не создаёт вторую запись и не считается ошибкой, поэтому
        Idempotency-Key не требуется.


        Существование объекта не проверяется намеренно: публичные карточки и так читаются по slug без
        аутентификации, проверка ничего не защищала бы, зато стоила бы лишнего запроса на каждое
        нажатие и ломала бы добавление, пока объект временно снят с публикации.
      tags: [marketplace-favorites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteTarget'
      responses:
        '201':
          description: Объект в избранном
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeFavorite
      summary: Убрать объект из избранного
      description: >-
        Идемпотентно: снятие уже снятого возвращает тот же результат с `removed: false`.
      tags: [marketplace-favorites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteTarget'
      responses:
        '200':
          description: Результат удаления
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: boolean
                    description: Была ли запись; false означает, что её уже не было
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

