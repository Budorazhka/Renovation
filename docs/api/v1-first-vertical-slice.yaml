      type: object
      required: [id, organizationId, ownerPositionId, stage, version, source, createdAt, contact, hasOpenNextAction]
      description: >
        GET /leads item shape (CrmService.CrmLeadReadModel) — contact
        встроен как whitelist-проекция {id, name, phone, email?}, никогда
        весь Contact-документ; ownerPositionId — null, если лид ещё не
        назначен ни на одну Position.
      properties:
        id: {type: string}
        organizationId: {type: string}
        ownerPositionId: {type: string, nullable: true}
        productType:
          type: string
          nullable: true
          enum: [sales, network, owner, agent]
          description: >
            Не задан (null) — лид на generic-пятёрке стадий. Задан — stage
            принадлежит воронке этого продукта, см. GET /leads/stage-definitions.
        stage:
          type: string
          description: >
            generic-стадия (new/contacted/qualified/converted/lost, если
            productType не задан) либо одна из стадий productType этого
            лида — полный список велик (до 22 значений на продукт), не
            перечислен здесь целиком, см. GET /leads/stage-definitions.
        version: {type: integer}
        source: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}
        stalled: {type: boolean}
        contact:
          type: object
          nullable: true
          properties:
            id: {type: string}
            name: {type: string}
            phone: {type: string}
            email: {type: string, nullable: true}
        hasOpenNextAction:
          type: boolean
          description: >
            CRM-003 мягкое правило (read-only индикатор, НЕ блокирует
            запись): true, если stage∈{new,contacted,qualified} И у лида
            есть хотя бы одна открытая (status:open) CRM Task. Для
            converted/lost — всегда false, правило их не касается. Для
            лидов С productType всегда false (правило покрывает только
            generic-воронку, out of scope этого прохода).
