  /admin/audit-events:
    get:
      operationId: adminListAuditEvents
      summary: >
        Read-only admin audit trail (D-07): scoped admin видит только
        события публикаций в своём publication read-scope (resource∈
        {development,unit,listing}); resource=admin_account (account/grant/
        session lifecycle) доступен только super_admin. Whitelist-проекция
        before/after — redaction на backend (admin-audit-projection.ts),
        secrets/tokens никогда не возвращаются.
      tags: [admin]
      parameters:
        - name: resource
          in: query
          schema: {type: string, enum: [development, unit, listing, admin_account]}
        - name: action
          in: query
          schema: {type: string}
        - name: resourceId
          in: query
          schema: {type: string}
        - name: publicationId
          in: query
          schema: {type: string}
        - name: actorId
          in: query
          schema: {type: string}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список audit-событий newest-first, ограниченный scope текущего администратора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditEventListResponse'
        '400':
          description: VALIDATION_FAILED — невалидный resource/cursor/limit/дата
          $ref: '#/components/responses/Error'
        '403':
          description: ADMIN_SCOPE_INSUFFICIENT — scoped admin запросил resource=admin_account явно
          $ref: '#/components/responses/Error'

