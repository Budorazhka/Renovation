        budgetCurrency: {type: string, nullable: true}
        expectedCloseDate: {type: string, nullable: true}
        rejectionReason: {type: string, nullable: true}
        rejectionComment: {type: string, nullable: true}
        telegram: {type: string, nullable: true}
        country: {type: string, nullable: true}
        realtorStage:
