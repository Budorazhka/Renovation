          description: >
            `[owner decision — 04.09.2026]` НЕ дубль stage — независимый
            указатель прогресса риэлтора, собственная 6-шаговая
            номенклатура (не входит в GET /leads/stage-definitions),
            независимо от productType лида.
        curatorStage:
          type: string
          nullable: true
          enum: [curator_1, curator_2, curator_3, curator_4, curator_5, curator_6]
          description: Симметрично realtorStage — независимый указатель прогресса куратора, своя 6-шаговая номенклатура.

