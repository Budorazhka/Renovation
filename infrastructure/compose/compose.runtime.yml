name: baza-runtime

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "${MONGO_REPLICA_SET_NAME:-rs0}", "--bind_ip_all", "--wiredTigerCacheSizeGB=1.25"]
    mem_limit: 2.5g
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_runtime_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'${MONGO_REPLICA_SET_NAME:-rs0}',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev_redis_password}"]
    mem_limit: 0.3g
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_runtime_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-dev_redis_password}' ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    mem_limit: 0.5g
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-dev_minio_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dev_minio_secret}
    volumes:
      - minio_runtime_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    # Утилита mc входит в образ сервера MinIO, поэтому отдельный образ
    # клиента не нужен: тот же образ уже скачан для сервера.
    #
    # Образы берутся из официального реестра MinIO на quay.io. На Docker Hub
    # 12.09.2026 перестали отдаваться сначала minio/mc, затем и minio/minio
    # («pull access denied»), и runtime-гейт падал ещё до запуска стека.
    # Локально это не проявлялось: старые образы лежали в кэше Docker.
    image: quay.io/minio/minio:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "${MINIO_ACCESS_KEY:-dev_minio_access}" "${MINIO_SECRET_KEY:-dev_minio_secret}" &&
        mc mb --ignore-existing "local/${MINIO_BUCKET_PRIVATE:-baza-private}" &&
        mc mb --ignore-existing "local/${MINIO_BUCKET_PUBLIC:-baza-public}"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    # Docker Desktop provides this name on Windows/macOS. The explicit
    # host-gateway mapping keeps the same host-browser MinIO flow working on
    # Linux GitHub runners as well.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      API_PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/baza?replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379
      # For host-browser E2E runs, set MINIO_ENDPOINT to an address reachable
      # by both this container and the browser (for example
      # http://host.docker.internal:9100). The default keeps the stack
      # self-contained for server-only/local compose usage.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      # Public derivative URLs are returned by the API and consumed by the
      # host browser. For host-browser E2E runs set this to the published
      # MinIO port (for example http://localhost:9100/baza-public).
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://minio:9000/baza-public}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dev_minio_access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dev_minio_secret}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-baza-private}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-baza-public}
      CORS_ALLOWED_ORIGIN_MARKETPLACE: ${CORS_ALLOWED_ORIGIN_MARKETPLACE:-http://localhost:4173}
      CORS_ALLOWED_ORIGIN_ADMIN: ${CORS_ALLOWED_ORIGIN_ADMIN:-http://localhost:4174}
      CORS_ALLOWED_ORIGIN_ERP: ${CORS_ALLOWED_ORIGIN_ERP:-http://localhost:4175}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    restart: unless-stopped
    # Keep the worker's presigned-upload endpoint resolvable on Linux runners
    # when CI points MINIO_ENDPOINT at the published host port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/baza?replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://minio:9000/baza-public}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dev_minio_access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dev_minio_secret}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-baza-private}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-baza-public}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Протухание актуальности объявлений. ActualityService.expireOverdueListings
  # умеет снимать просроченные listing'и с публикации, apps/api/src/jobs/
  # actuality-expire.command.ts даёт ей точку входа вне HTTP — но до сих пор
  # эту точку никто не вызывал ни в одном окружении, и объявления не протухали
  # никогда. Здесь появляется расписание.
  #
  # Профиль `scheduled`: по умолчанию сервис не поднимается, чтобы прогон E2E
  # не получал фоновых мутаций данных под собой. Запуск —
  # `docker compose --profile scheduled up -d`.
  #
  # Цикл на sh, а не cron-образ и не @nestjs/schedule в процессе API: в кодовой
  # базе нет ни одной scheduling-зависимости (см. докстринг команды), и здесь
  # добавляется расписание, а не новый паттерн в коде.
  actuality-expire:
    profiles: ["scheduled"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/baza?replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://minio:9000/baza-public}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dev_minio_access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dev_minio_secret}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-baza-private}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-baza-public}
      ACTUALITY_EXPIRE_INTERVAL_SECONDS: ${ACTUALITY_EXPIRE_INTERVAL_SECONDS:-3600}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # `|| true` намеренно: команда выходит с кодом 1, когда часть listing'ов не
    # обработалась (result.errors > 0). Это повод для записи в лог, а не для
    # остановки расписания — иначе один битый listing выключил бы протухание
    # для всех остальных до ручного вмешательства.
    command:
      - >-
        while true; do
        node apps/api/dist/jobs/actuality-expire.command.js || echo "[actuality-expire] прогон завершился с ошибками, расписание продолжается";
        sleep "$${ACTUALITY_EXPIRE_INTERVAL_SECONDS}";
        done

  # Истечение броней по сроку (11.09.2026). До этого бронь не истекала вовсе:
  # юнит оставался reserved навсегда и пропадал с витрины. Тот же профиль
  # `scheduled` и тот же цикл на sh, что у actuality-expire выше, по тем же
  # причинам.
  #
  # Интервал по умолчанию — 5 минут, а не час: бронь — это удержание юнита на
  # часы или дни, и лишний час в reserved после срока заметен покупателю. Прогон
  # дешёвый: выборка по частичному индексу dateRange.expiresAt.
  booking-expire:
    profiles: ["scheduled"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/baza?replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://minio:9000/baza-public}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dev_minio_access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dev_minio_secret}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-baza-private}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-baza-public}
      BOOKING_EXPIRE_INTERVAL_SECONDS: ${BOOKING_EXPIRE_INTERVAL_SECONDS:-300}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do
        node apps/api/dist/jobs/booking-expire.command.js || echo "[booking-expire] прогон завершился с ошибками, расписание продолжается";
        sleep "$${BOOKING_EXPIRE_INTERVAL_SECONDS}";
        done

  admin-web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.admin-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ADMIN_WEB_PORT:-4174}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  marketplace-web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.marketplace-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MARKETPLACE_WEB_PORT:-4173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  erp-web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.erp-web
      args:
        VITE_PLATFORM_API_BASE_URL: ${VITE_PLATFORM_API_BASE_URL:-/}
        VITE_CRM_API_BASE_URL: ${VITE_CRM_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ERP_WEB_PORT:-4175}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongodb_runtime_data:
  redis_runtime_data:
  minio_runtime_data:
